name: Build Windows installer

# Builds the packaged Cerebro executable and installer. PyInstaller can only
# build for the platform it runs on, so this must run on Windows.
#
# Every push to main gets a downloadable artifact; pushing a version tag also
# attaches the installer to a GitHub release. Both "v0.3.0" and a bare "0.3.0"
# are accepted, so it doesn't matter which style you reach for.

on:
  push:
    branches: [main]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"   # v0.3.0, v1.2.3-rc1
      - "[0-9]+.[0-9]+.[0-9]+*"    # 0.3.0 (no leading v)
  # Run the complete packaging contract for every pull request. The installer
  # also bundles backend, desktop, extension, asset, and version files, so a
  # narrow path filter can let a broken package reach main without this check.
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Validate release metadata
        id: release_metadata
        shell: pwsh
        run: |
          $declaredVersion = (Get-Content VERSION -Raw).Trim()
          $versionMatch = [regex]::Match(
            $declaredVersion,
            '^(\d+)\.(\d+)\.(\d+)(?:[-+].+)?$'
          )
          if (-not $versionMatch.Success) {
            throw "VERSION must use semantic versioning (for example 1.2.3 or 1.2.3-rc1); got '$declaredVersion'."
          }

          $manifest = Get-Content browser-extension/src/manifest.json -Raw | ConvertFrom-Json
          if ($manifest.version -ne $declaredVersion) {
            throw "Browser extension version '$($manifest.version)' does not match VERSION '$declaredVersion'."
          }

          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
            if ($tagVersion -ne $declaredVersion) {
              throw "Tag '$env:GITHUB_REF_NAME' does not match VERSION '$declaredVersion'."
            }

            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main --depth=1
            if ($LASTEXITCODE -ne 0) {
              throw "Could not fetch origin/main for release validation."
            }
            $mainSha = (git rev-parse origin/main).Trim()
            if ($env:GITHUB_SHA -ne $mainSha) {
              throw "Release tag '$env:GITHUB_REF_NAME' points to $env:GITHUB_SHA, but current main is $mainSha. Tag the tested main commit instead."
            }
            $appVersion = $tagVersion
          } else {
            $appVersion = "$declaredVersion-dev.$env:GITHUB_RUN_NUMBER"
          }

          $versionInfoVersion = "$($versionMatch.Groups[1].Value).$($versionMatch.Groups[2].Value).$($versionMatch.Groups[3].Value).0"
          "app_version=$appVersion" >> $env:GITHUB_OUTPUT
          "version_info_version=$versionInfoVersion" >> $env:GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-ai.txt
          pip install -r backend/requirements-documents.txt
          pip install -r desktop/requirements.txt
          pip install -r desktop/requirements-capture.txt
          pip install pyinstaller

      - name: Run the test suite
        # PYTHONUTF8 makes Python read and write files as UTF-8 regardless of
        # the runner's ANSI codepage. The source tree contains em-dashes and
        # tick marks, and without this a file read that works on every dev
        # machine fails only here, which is a slow way to find out.
        env:
          PYTHONUTF8: "1"
        run: python test_mvp.py

      - name: Build the executables
        env:
          PYTHONUTF8: "1"
        run: pyinstaller packaging/cerebro.spec --noconfirm --distpath dist --workpath build

      - name: Check the build starts
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "dist\Cerebro\Cerebro.exe" `
            -ArgumentList "--no-browser","--port","8123" -PassThru
          $ok = $false
          foreach ($attempt in 1..30) {
            Start-Sleep -Seconds 2
            try {
              $response = Invoke-WebRequest "http://127.0.0.1:8123/health" -UseBasicParsing -TimeoutSec 3
              if ($response.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
          }
          Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "The packaged build did not answer on /health" }
          Write-Host "Packaged build started and answered /health."

      - name: Build the installer
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.release_metadata.outputs.app_version }}
          VERSION_INFO_VERSION: ${{ steps.release_metadata.outputs.version_info_version }}
        run: |
          $compilerCandidates = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'),
            (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe')
          )
          $compiler = $compilerCandidates |
            Where-Object { Test-Path -LiteralPath $_ } |
            Select-Object -First 1
          if (-not $compiler) {
            throw "Inno Setup 6 compiler not found. Checked: $($compilerCandidates -join ', ')"
          }

          & $compiler "/DAppVersion=$env:APP_VERSION" "/DVersionInfoVersion=$env:VERSION_INFO_VERSION" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE."
          }
          if (-not (Test-Path -LiteralPath 'dist\CerebroSetup.exe')) {
            throw 'Inno Setup completed without producing dist\CerebroSetup.exe.'
          }

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: CerebroSetup
          path: dist/CerebroSetup.exe
          if-no-files-found: error

      - name: Attach the installer to the release
        # Any version tag, with or without a leading "v". Creating the release
        # if one does not exist, or adding the exe to an existing one.
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CerebroSetup.exe
          generate_release_notes: true
