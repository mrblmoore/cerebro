<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cerebro · Setup</title>
  <link rel="stylesheet" href="/static/cerebro.css">
  <link rel="icon" type="image/png" href="/static/cerebro-256.png">
</head>
<body>
  <div id="topbar"></div>

  <div class="wrap narrow">
    <div class="steps" id="steps"></div>
    <div id="step"></div>
    <div class="wizard-nav">
      <button id="back" type="button" class="ghost">← Back</button>
      <div class="spacer"></div>
      <span id="save-status" class="muted" style="font-size:12px" aria-live="polite"></span>
      <button id="skip" type="button" class="ghost">Skip for now</button>
      <button id="next" type="button" class="primary">Save & continue →</button>
    </div>
  </div>

<script src="/static/cerebro.js"></script>
<script>
document.getElementById('topbar').innerHTML = topbar('/setup');

let config = {};     // field key -> current value
let fieldMeta = {};  // field key -> descriptor
let runtime = {};    // packaged paths and runtime details
const pending = {};  // changes staged by the wizard
const wizardModels = {};       // live model lists, once Refresh has been pressed
const wizardCustomModel = {};  // model fields switched to free-text entry
let index = 0;

const STEPS = [
  { id: 'welcome',   title: 'Welcome to Cerebro',  render: renderWelcome,   skippable: false },
  { id: 'database',  title: 'Choose storage',      render: renderDatabase,  skippable: false },
  { id: 'ai',        title: 'Connect an AI model', render: renderAI,        skippable: true },
  { id: 'knowledge', title: 'Knowledge search',    render: renderKnowledge, skippable: true },
  { id: 'desktop',   title: 'Desktop & browser',   render: renderDesktop,   skippable: true },
  { id: 'copilot',   title: 'Microsoft Copilot',   render: renderCopilot,   skippable: true },
  { id: 'done',      title: 'You are set up',      render: renderDone,      skippable: false },
];

function head(eyebrow, title, description) {
  return `<div class="step-head">
    <div class="eyebrow">${esc(eyebrow)}</div>
    <h1>${esc(title)}</h1>
    <p>${description}</p>
  </div>`;
}

function choice(name, value, title, desc, tag) {
  const checked = pending[name] !== undefined ? pending[name] : config[name];
  const on = String(checked) === value;
  return `<label class="choice" data-selected="${on}">
    <input type="radio" name="${esc(name)}" value="${esc(value)}" ${on ? 'checked' : ''}>
    <span>
      <span class="title">${esc(title)}${tag ? ` <span class="tag">${esc(tag)}</span>` : ''}</span>
      <span class="desc">${desc}</span>
    </span>
  </label>`;
}

function textField(key, extra = '') {
  const meta = fieldMeta[key] || {};
  const value = pending[key] !== undefined ? pending[key] : (config[key] ?? '');
  const type = meta.type === 'password' ? 'password' : (meta.type === 'number' ? 'number' : 'text');
  return `<label class="field" ${extra}>
    <span class="name">${esc(meta.label || key)}</span>
    ${meta.help ? `<span class="help">${esc(meta.help)}</span>` : ''}
    <input type="${type}" data-key="${esc(key)}" value="${esc(value)}"
           placeholder="${esc(meta.placeholder || '')}" autocomplete="off">
  </label>`;
}

function selectField(key) {
  const meta = fieldMeta[key] || {};
  const value = pending[key] !== undefined ? pending[key] : (config[key] ?? '');
  return `<label class="field">
    <span class="name">${esc(meta.label || key)}</span>
    ${meta.help ? `<span class="help">${esc(meta.help)}</span>` : ''}
    <select data-key="${esc(key)}">
      ${(meta.options || []).map((option) => `
        <option value="${esc(option.value)}"${String(option.value) === String(value) ? ' selected' : ''}>${esc(option.label)}</option>`).join('')}
    </select>
  </label>`;
}

/**
 * A model picker: the curated list, plus a Refresh that asks the provider what
 * this account can really use, plus a custom box for anything not listed.
 * Keeps the wizard from asking someone to type an exact model ID from memory.
 */
function modelField(key, provider) {
  const meta = fieldMeta[key] || {};
  const value = pending[key] !== undefined ? pending[key] : (config[key] ?? '');
  const live = wizardModels[provider];
  const options = live ? live.models : (meta.options || []);
  const known = options.some((option) => option.id === value);
  const custom = wizardCustomModel[key] || (value && !known);

  return `<label class="field">
    <span class="name">${esc(meta.label || key)}</span>
    ${meta.help ? `<span class="help">${esc(meta.help)}</span>` : ''}
    <div style="display:flex;gap:8px;align-items:center">
      <select data-model-select="${esc(key)}" data-model-provider="${esc(provider)}" style="flex:1">
        ${options.map((option) => `
          <option value="${esc(option.id)}"${option.id === value && !custom ? ' selected' : ''}>
            ${esc(option.label || option.id)}${option.note ? ` — ${esc(option.note)}` : ''}
          </option>`).join('')}
        <option value="__custom__"${custom ? ' selected' : ''}>Custom model ID…</option>
      </select>
      <button type="button" class="btn-sm" data-model-refresh="${esc(provider)}">Refresh</button>
    </div>
    ${custom
      ? `<input type="text" data-key="${esc(key)}" value="${esc(value)}"
                placeholder="${esc(meta.placeholder || '')}" autocomplete="off" style="margin-top:8px">`
      : `<input type="hidden" data-key="${esc(key)}" value="${esc(value)}">`}
    ${live && live.live
      ? `<span class="help">✓ Listed from your account — every option here is valid.</span>`
      : (live ? `<span class="help">${esc(live.error)}</span>` : '')}
  </label>`;
}

// ------------------------------------------------------------------- steps
async function renderWelcome() {
  const el = document.getElementById('step');
  el.innerHTML = head('Step 1 of 7', 'Welcome to Cerebro',
    'Cerebro runs entirely on this machine. This wizard takes about a minute — every ' +
    'answer can be changed later in <a href="/settings">Settings</a>.') +
    `<div class="card"><header><h2>System check</h2>
       <button class="btn-sm ghost" id="recheck">Re-run</button></header>
     <div id="checks"><div class="empty">Running checks…</div></div></div>`;

  document.getElementById('recheck').onclick = loadChecks;
  loadChecks();
}

async function loadChecks() {
  const host = document.getElementById('checks');
  try {
    const data = await API.get('/api/system/diagnostics');
    runtime = { ...runtime, ...data };
    host.innerHTML = data.checks.map((check) => {
      const optional = check.optional_package;
      const icon = optional ? (check.installed ? '✅' : '○') : (check.ok ? '✅' : (check.required ? '❌' : '⚠️'));
      return `<div class="check">
        <span class="status">${icon}</span>
        <span>
          <div class="label">${esc(check.label)}</div>
          <div class="detail">${esc(check.detail || '')}</div>
        </span>
      </div>`;
    }).join('');
  } catch (error) {
    host.innerHTML = `<div class="empty">Could not reach the API: ${esc(error.message)}</div>`;
  }
}

function renderDatabase() {
  const url = pending.DATABASE_URL !== undefined ? pending.DATABASE_URL : config.DATABASE_URL;
  const isSqlite = String(url || '').startsWith('sqlite');
  document.getElementById('step').innerHTML = head('Step 2 of 7', 'Where should Cerebro store data?',
    'Cases, events and context history live here. The built-in option needs nothing installed.') +
    `<div id="db-choices">
      ${choice('__db', 'sqlite', 'Built-in database (SQLite)',
        'Zero setup — one file under <code class="inline">data/cerebro.db</code>. Ideal for a single workstation.',
        'Recommended')}
      ${choice('__db', 'external', 'PostgreSQL or another server',
        'Use when several people or machines share one Cerebro instance.')}
    </div>
    <div id="db-url" class="${isSqlite ? 'hidden' : ''}" style="margin-top:16px">
      ${textField('DATABASE_URL')}
      <div class="callout warn"><span class="icon">⚠️</span>
        <span>PostgreSQL also needs its driver:
          <code class="inline">pip install -r backend/requirements-postgres.txt</code></span></div>
      <div class="actions"><button id="test-db" class="btn-sm">Test connection</button></div>
    </div>`;

  // Pre-select the radio matching the saved URL.
  const target = isSqlite ? 'sqlite' : 'external';
  document.querySelectorAll('input[name="__db"]').forEach((input) => {
    input.checked = input.value === target;
    input.closest('.choice').dataset.selected = input.checked;
  });

  document.getElementById('db-choices').onchange = (event) => {
    const external = event.target.value === 'external';
    document.getElementById('db-url').classList.toggle('hidden', !external);
    if (!external) pending.DATABASE_URL = runtime.default_database_url || config.DATABASE_URL;
    else if (!pending.DATABASE_URL) pending.DATABASE_URL = 'postgresql+psycopg://user:password@localhost:5432/cerebro';
    syncChoices();
    const input = document.querySelector('[data-key="DATABASE_URL"]');
    if (input) input.value = pending.DATABASE_URL || '';
  };

  const test = document.getElementById('test-db');
  if (test) test.onclick = () => runTest('database', test);
}

function renderAI() {
  const provider = pending.LLM_PROVIDER !== undefined ? pending.LLM_PROVIDER : config.LLM_PROVIDER;
  document.getElementById('step').innerHTML = head('Step 3 of 7', 'Connect an AI model',
    'Optional. Cerebro tracks context, events and knowledge without it — AI only adds ' +
    'case summaries and troubleshooting suggestions.') +
    `<div id="ai-choices">
      ${choice('LLM_PROVIDER', 'none', 'Not now',
        'Everything except generated summaries works. You can add a provider any time.')}
      ${choice('LLM_PROVIDER', 'ollama', 'Ollama — local models',
        'Runs on your machine, nothing leaves it. Needs <a href="https://ollama.com" target="_blank" rel="noopener">Ollama</a> installed.',
        'Most private')}
      ${choice('LLM_PROVIDER', 'openai', 'OpenAI or compatible API',
        'Best quality. Requires an API key; prompts are sent to the provider.')}
      ${choice('LLM_PROVIDER', 'bedrock', 'Amazon Bedrock',
        'Use a Bedrock foundation model or inference profile through your AWS account.')}
      ${choice('LLM_PROVIDER', 'qwen', 'Qwen', 'Any Qwen-compatible chat completions endpoint.')}
    </div>
    <div id="ai-fields" style="margin-top:18px"></div>`;

  document.getElementById('ai-choices').onchange = (event) => {
    pending.LLM_PROVIDER = event.target.value;
    syncChoices();
    renderAIFields();
  };
  renderAIFields(provider);
}

function renderAIFields(fallback) {
  const provider = pending.LLM_PROVIDER !== undefined ? pending.LLM_PROVIDER : (fallback || config.LLM_PROVIDER);
  const host = document.getElementById('ai-fields');
  if (!host) return;

  const groups = {
    none: '',
    openai: textField('OPENAI_API_KEY') + modelField('OPENAI_MODEL', 'openai'),
    ollama: textField('OLLAMA_URL') + modelField('OLLAMA_MODEL', 'ollama'),
    qwen: textField('QWEN_API_URL') + textField('QWEN_API_KEY') +
          modelField('QWEN_MODEL', 'qwen'),
    bedrock: renderBedrockFields(),
  };

  host.innerHTML = groups[provider] || '';
  if (provider !== 'none') {
    host.innerHTML += `<div class="actions"><button id="test-ai" class="btn-sm">Save & test</button></div>`;
    document.getElementById('test-ai').onclick = async (event) => {
      await saveStaged();
      runTest('ai', event.target);
    };
  }
  bindInputs();
  const auth = document.querySelector('[data-key="BEDROCK_AUTH_MODE"]');
  if (auth) auth.onchange = () => {
    pending.BEDROCK_AUTH_MODE = auth.value;
    renderAIFields();
  };
}

function renderBedrockFields() {
  const auth = pending.BEDROCK_AUTH_MODE !== undefined
    ? pending.BEDROCK_AUTH_MODE : (config.BEDROCK_AUTH_MODE || 'default');
  let credentials = '';
  if (auth === 'api_key') {
    credentials = textField('BEDROCK_API_KEY') +
      `<div class="callout"><span class="icon">🔑</span><span>
        Create a key in the Amazon Bedrock console under <strong>API keys</strong>.
        This is the simplest option — one key, nothing else to configure.
      </span></div>`;
  }
  if (auth === 'profile') credentials = textField('BEDROCK_AWS_PROFILE');
  if (auth === 'keys') {
    credentials = textField('BEDROCK_AWS_ACCESS_KEY_ID') +
      textField('BEDROCK_AWS_SECRET_ACCESS_KEY') + textField('BEDROCK_AWS_SESSION_TOKEN') +
      `<div class="callout warn"><span class="icon">⚠️</span><span>
        Prefer temporary credentials. Cerebro stores these values only in its local configuration file.
      </span></div>`;
  }
  return textField('BEDROCK_REGION') + selectField('BEDROCK_AUTH_MODE') + credentials +
    modelField('BEDROCK_MODEL_ID', 'bedrock') +
    `<div class="callout"><span class="icon">ℹ️</span><span>
      Unlike OpenAI, AWS has no single API key by default — it signs each request with an
      identity. Pick <strong>Bedrock API key</strong> above for a one-key setup, or leave the
      default to reuse the AWS sign-in already on this computer. Either way the identity needs
      <code class="inline">bedrock:InvokeModel</code>.
    </span></div>`;
}

function renderKnowledge() {
  document.getElementById('step').innerHTML = head('Step 4 of 7', 'Knowledge search',
    'Cerebro searches your indexed documents to surface the right article while you work.') +
    `<div id="kb-choices">
      ${choice('VECTOR_BACKEND', 'local', 'Built-in vector store',
        'No extra services. Vectors are stored next to your documents.', 'Recommended')}
      ${choice('VECTOR_BACKEND', 'qdrant', 'Qdrant',
        'For large document sets or a shared index. Needs a running Qdrant server.')}
    </div>
    <div id="kb-fields" style="margin-top:18px"></div>`;

  document.getElementById('kb-choices').onchange = (event) => {
    pending.VECTOR_BACKEND = event.target.value;
    syncChoices();
    renderKnowledgeFields();
  };
  renderKnowledgeFields();
}

function renderKnowledgeFields() {
  const backend = pending.VECTOR_BACKEND !== undefined ? pending.VECTOR_BACKEND : config.VECTOR_BACKEND;
  const host = document.getElementById('kb-fields');
  if (!host) return;
  host.innerHTML = (backend === 'qdrant' ? textField('QDRANT_URL') + textField('QDRANT_API_KEY') : '') +
    `<div class="callout"><span class="icon">ℹ️</span><span>
      Knowledge search uses Cerebro's included offline index by default. It does not require
      OpenAI and does not change the AI model you selected. Advanced embedding options remain
      available later in Settings → Knowledge Search.
    </span></div>`;
  bindInputs();
}

function renderDesktop() {
  const origin = window.location.origin;
  const packaged = Boolean(runtime.packaged);
  const extensionPath = runtime.extension_dir || 'browser-extension/src';
  document.getElementById('step').innerHTML = head('Step 5 of 7', 'Desktop widget & browser extension',
    'The Windows installer includes the widget, desktop monitoring components, and every file ' +
    'needed by the browser extension.') +
    `<div class="card" style="margin-bottom:14px"><header><h2>🪟 Desktop widget</h2></header>
      <div class="body">
        <p>An always-on-top panel showing live context, suggestions and knowledge search.
           ${packaged
             ? 'Launch <strong>Cerebro Widget</strong> from the Start menu or desktop. It starts Cerebro and its bundled desktop helpers automatically — Python is not required.'
             : 'From this source checkout, run <code class="inline">python cerebro.py widget</code>.'}</p>
      </div></div>

    <div class="card" style="margin-bottom:14px"><header><h2>🌐 Browser extension</h2></header>
      <div class="body">
        <p>Detects Salesforce and ServiceNow cases and reports them to Cerebro automatically.</p>
        <ol style="margin:0 0 12px 18px; padding:0; color:var(--text-dim); font-size:13px">
          <li>Open <code class="inline">chrome://extensions</code> (or <code class="inline">edge://extensions</code>)</li>
          <li>Turn on <strong>Developer mode</strong></li>
          <li>Choose <strong>Load unpacked</strong> and select <code class="inline">${esc(extensionPath)}</code></li>
          <li>Open the extension and confirm the API URL is <code class="inline">${esc(origin)}</code></li>
        </ol>
      </div></div>

    <div class="card"><header><h2>🖥️ Screenpipe integration</h2></header>
      <div class="body">
        <p>Cerebro will connect automatically whenever Screenpipe is running at
           <code class="inline">${esc(config.SCREENPIPE_URL || 'http://localhost:3030')}</code>.
           If an official Screenpipe installation is detected, the widget will start it too.
           Screenpipe itself is separately licensed and cannot be redistributed inside Cerebro.</p>
        <label class="switch">
          <input type="checkbox" data-key="SCREENPIPE_ENABLED"
            ${String(pending.SCREENPIPE_ENABLED ?? config.SCREENPIPE_ENABLED) === 'true' ? 'checked' : ''}>
          <span class="track"></span><span>Connect to Screenpipe automatically</span>
        </label>
        <p style="margin-bottom:0"><a href="https://screenpi.pe" target="_blank" rel="noopener">Get Screenpipe from its publisher</a></p>
      </div></div>`;
  bindInputs();
}

function renderCopilot() {
  const enabled = String(pending.COPILOT_BRIDGE_ENABLED ?? config.COPILOT_BRIDGE_ENABLED) === 'true';
  document.getElementById('step').innerHTML = head('Step 6 of 7', 'Microsoft Copilot',
    'Optional. Cerebro is complete on its own — this lets you also reach it from ' +
    'Teams or your phone through a Copilot Studio agent.') +
    `<div class="card" style="margin-bottom:14px">
      <div class="body">
        <p>With this on, Cerebro shares a folder in OneDrive that your agent can
           read: what you're working on, what it has learned, and how you write.
           Your agent can also ask Cerebro to do things on this machine.</p>
        <p style="margin-bottom:0"><strong>Screenshots and typed text never leave
           this machine</strong> — only the facts Cerebro has already distilled.</p>
      </div>
    </div>

    <label class="switch" style="margin-bottom:14px">
      <input type="checkbox" data-key="COPILOT_BRIDGE_ENABLED" ${enabled ? 'checked' : ''}>
      <span class="track"></span><span>Connect a Copilot Studio agent</span>
    </label>

    <div id="copilot-fields" class="${enabled ? '' : 'hidden'}">
      ${textField('COPILOT_BRIDGE_DIR')}
      <div class="callout"><span class="icon">💡</span>
        <span>Create a folder in OneDrive first — something like
          <code class="inline">OneDrive\\Cerebro\\copilot</code> — then paste its
          full path here. Settings → Microsoft Copilot has the full walkthrough,
          including the text to paste into your agent.</span></div>
    </div>`;

  // bindInputs assigns onchange, so attach with addEventListener *after* it —
  // otherwise the generic handler replaces this one and the fields never hide.
  bindInputs();
  const toggle = document.querySelector('[data-key="COPILOT_BRIDGE_ENABLED"]');
  toggle.addEventListener('change', () => {
    document.getElementById('copilot-fields').classList.toggle('hidden', !toggle.checked);
  });
}

function renderDone() {
  const provider = pending.LLM_PROVIDER ?? config.LLM_PROVIDER;
  const backend = pending.VECTOR_BACKEND ?? config.VECTOR_BACKEND;
  const url = pending.DATABASE_URL ?? config.DATABASE_URL;

  document.getElementById('step').innerHTML = head('Step 7 of 7', 'You are set up',
    'Cerebro is configured and running. Here is what you chose.') +
    `<div class="card" style="margin-bottom:16px">
      <ul class="list">
        <li><span class="icon">🗄️</span><span class="main">
          <div class="title">Storage</div>
          <div class="meta">${String(url || '').startsWith('sqlite') || !url ? 'Built-in SQLite database' : esc(url.split('@').pop())}</div>
        </span></li>
        <li><span class="icon">🧠</span><span class="main">
          <div class="title">AI provider</div>
          <div class="meta">${provider === 'none' ? 'Disabled — add one later in Settings' : esc(provider)}</div>
        </span></li>
        <li><span class="icon">📚</span><span class="main">
          <div class="title">Knowledge search</div>
          <div class="meta">${backend === 'qdrant' ? 'Qdrant' : 'Built-in vector store'}</div>
        </span></li>
        <li><span class="icon">🤝</span><span class="main">
          <div class="title">Microsoft Copilot</div>
          <div class="meta">${String(pending.COPILOT_BRIDGE_ENABLED ?? config.COPILOT_BRIDGE_ENABLED) === 'true'
            ? 'Connected — finish the agent setup in Settings'
            : 'Not connected'}</div>
        </span></li>
      </ul>
    </div>
    <div class="callout"><span class="icon">💡</span>
      <span>Next: index a few knowledge articles from the dashboard, then launch the desktop
      widget so context follows you around.</span></div>`;

  document.getElementById('next').textContent = 'Open dashboard →';
}

// ------------------------------------------------------------------ wiring
function syncChoices() {
  document.querySelectorAll('.choice').forEach((choiceEl) => {
    const input = choiceEl.querySelector('input');
    choiceEl.dataset.selected = input.checked;
  });
}

function bindInputs() {
  document.querySelectorAll('[data-key]').forEach((input) => {
    input.oninput = input.onchange = () => {
      pending[input.dataset.key] = input.type === 'checkbox' ? input.checked : input.value;
    };
  });

  document.querySelectorAll('[data-model-select]').forEach((select) => {
    select.onchange = () => {
      const key = select.dataset.modelSelect;
      if (select.value === '__custom__') {
        wizardCustomModel[key] = true;
      } else {
        delete wizardCustomModel[key];
        pending[key] = select.value;
      }
      renderAIFields();
    };
  });

  document.querySelectorAll('[data-model-refresh]').forEach((button) => {
    button.onclick = async () => {
      const provider = button.dataset.modelRefresh;
      button.disabled = true;
      button.textContent = 'Loading…';
      try {
        // Credentials typed on this step have to reach the server before it
        // can authenticate with them.
        collectVisibleInputs();
        await API.put('/api/system/settings', pending);
        wizardModels[provider] = await API.get(`/api/system/models/${provider}`);
        if (!wizardModels[provider].live) toast(wizardModels[provider].error, 'err', 8000);
        renderAIFields();
      } catch (error) {
        toast(error.message, 'err', 6000);
      } finally { button.disabled = false; button.textContent = 'Refresh'; }
    };
  });
}

function collectVisibleInputs() {
  document.querySelectorAll('[data-key]').forEach((input) => {
    pending[input.dataset.key] = input.type === 'checkbox' ? input.checked : input.value;
  });
}

function setNavigationBusy(busy, label = '') {
  for (const id of ['back', 'skip', 'next']) document.getElementById(id).disabled = busy;
  document.getElementById('save-status').textContent = label;
}

async function runTest(target, button) {
  const original = button.textContent;
  button.disabled = true;
  button.textContent = 'Testing…';
  try {
    const result = await API.post(`/api/system/test/${target}`);
    toast(result.detail || (result.ok ? 'Connection OK' : 'Failed'), result.ok ? 'ok' : 'err', 6000);
  } catch (error) {
    toast(error.message, 'err', 6000);
  } finally {
    button.disabled = false;
    button.textContent = original;
  }
}

async function saveStaged() {
  collectVisibleInputs();
  const changes = { ...pending };
  delete changes.__db;
  if (!Object.keys(changes).length) return true;
  try {
    const result = await API.put('/api/system/settings', changes);
    Object.assign(config, changes);
    for (const key of Object.keys(changes)) delete pending[key];
    if (result.restart_required) {
      toast('Saved. Restart Cerebro for the database change to take effect.', 'ok', 7000);
    } else {
      document.getElementById('save-status').textContent = 'Saved';
    }
    return true;
  } catch (error) {
    toast(`Could not save: ${error.message}`, 'err', 7000);
    return false;
  }
}

function renderSteps() {
  document.getElementById('steps').innerHTML = STEPS.map((_, i) =>
    `<div class="step ${i < index ? 'done' : ''} ${i === index ? 'active' : ''}"></div>`).join('');
}

async function show(newIndex) {
  index = Math.max(0, Math.min(STEPS.length - 1, newIndex));
  renderSteps();
  document.getElementById('back').classList.toggle('hidden', index === 0);
  document.getElementById('skip').classList.toggle('hidden', !STEPS[index].skippable);
  document.getElementById('next').textContent =
    index === STEPS.length - 1 ? 'Open dashboard →' : 'Save & continue →';
  document.getElementById('save-status').textContent = '';
  await STEPS[index].render();
  bindInputs();
  syncChoices();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

document.getElementById('back').onclick = () => show(index - 1);
document.getElementById('skip').onclick = async () => {
  setNavigationBusy(true, 'Saving…');
  const saved = await saveStaged();
  setNavigationBusy(false, saved ? 'Saved' : 'Not saved');
  if (saved) await show(index + 1);
};
document.getElementById('next').onclick = async () => {
  setNavigationBusy(true, 'Saving…');
  if (!(await saveStaged())) {
    setNavigationBusy(false, 'Not saved — check the message above');
    return;
  }
  if (index === STEPS.length - 1) {
    await API.post('/api/system/setup/complete').catch(() => {});
    window.location.href = '/';
    return;
  }
  setNavigationBusy(false, 'Saved');
  await show(index + 1);
};

(async function init() {
  refreshConnectionPill();
  try {
    runtime = await API.get('/api/system/info');
    const described = await API.get('/api/system/settings');
    described.fields.forEach((field) => {
      fieldMeta[field.key] = field;
      config[field.key] = field.value;
    });
  } catch (error) {
    toast(`Could not load settings: ${error.message}`, 'err', 8000);
  }
  await show(0);
})();
</script>
</body>
</html>
