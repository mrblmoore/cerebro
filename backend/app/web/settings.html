<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cerebro · Settings</title>
  <link rel="stylesheet" href="/static/cerebro.css">
  <link rel="stylesheet" href="/static/ui/settings-view.css">
  <link rel="icon" type="image/png" href="/static/cerebro-256.png">
</head>
<body>
  <!-- Settings live in the app window (Settings in its sidebar). This page shows
       the same view for a plain browser. -->
  <div id="topbar"></div>
  <div id="settings-root"></div>

<script src="/static/cerebro.js"></script>
<script type="module">
  import { mountSettings } from '/static/ui/settings-view.js';

  document.getElementById('topbar').innerHTML = topbar('/settings');
  refreshConnectionPill();
  const group = (location.hash || '').replace('#', '') || null;
  const view = mountSettings(document.getElementById('settings-root'),
                             { api: API, toast, esc, initialGroup: group });
  window.addEventListener('beforeunload', (event) => {
    if (view.isDirty()) { event.preventDefault(); event.returnValue = ''; }
  });
</script>
</body>
</html>
